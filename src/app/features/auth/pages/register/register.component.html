<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8 space-y-6">
            <!-- Header -->
            <div class="text-center">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                   <i class="pi pi-user text-color-white" style="font-size: 2.5rem"></i>

                </div>
                <h2 class="text-2xl font-bold text-gray-800">Crear cuenta</h2>
                <p class="text-gray-500 text-sm mt-1">Completa tus datos para registrarte</p>
            </div>

            <!-- Form -->
            <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-5">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                             <i class="pi pi-at text-gray-400"></i>

                        </div>
                        <input
                            id="email"
                            type="email"
                            formControlName="email"
                            placeholder="tu@email.com"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-gray-800"
                        />
                    </div>
                </div>

                <!-- Name Field -->
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                             <i class="pi pi-user text-gray-500"></i>
                        </div>
                        <input
                            id="name"
                            type="text"
                            formControlName="name"
                            placeholder="Juan"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-gray-800"
                        />
                    </div>
                </div>

                <!-- Apellido Field -->
                <div>
                    <label for="apellido" class="block text-sm font-medium text-gray-700 mb-2">
                        Apellido
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                             <i class="pi pi-user-edit text-gray-500"></i>
                        </div>
                        <input
                            id="apellidos"
                            type="text"
                            formControlName="apellidos"
                            placeholder="Pérez"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-gray-800"
                        />
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                             <i class="pi pi-lock text-gray-500"></i>
                        </div>
                        <input
                            id="password"
                            type="password"
                            formControlName="password"
                            placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-gray-800"
                        />
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    [disabled]="registerForm.invalid"
                    class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-semibold py-3 rounded-lg hover:from-blue-600 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transform hover:scale-[1.02] transition-all duration-200 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                >
                    Registrarse
                </button>
            </form>

            <!-- Footer -->
            <div class="text-center text-sm text-gray-600">
                ¿Ya tienes cuenta? 
                <a href="#" class="text-blue-600 font-medium hover:text-blue-700 transition">
                    Inicia sesión
                </a>
            </div>
        </div>
    </div>
</div>
