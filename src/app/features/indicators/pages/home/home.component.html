<div class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Título -->
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Indicadores</h2>
        
        <!-- Contenedor de Cards -->
        <div class="flex flex-wrap justify-center gap-6">
            
            <!-- Card 1 - Usuarios -->
             @for( indicator of indicators(); track indicator.id){
            <p-card styleClass="w-72 shadow-lg hover:shadow-xl transition-shadow">
                <ng-template pTemplate="header">
                    <div class="text-center pt-6">
                        <div class="text-5xl mb-2"></div>
                    </div>
                </ng-template>
                <div class="text-center">
                    <h3 class="text-gray-500 text-sm uppercase tracking-wide mb-2">{{indicator.nombre}}</h3>
                    <p class="text-4xl font-bold text-green-500 mb-2">1,234</p>
                    <p class="text-gray-400 text-sm">+12% este mes</p>
                </div>
                <p-button label="" icon="pi pi-user" severity="info" rounded="true" (click)="showModal(indicator)"></p-button>
            </p-card>}
            
            
            
        </div>
    </div>
</div>
<app-custom-modal
[visible]="openModal()"
(visibleChange)="openModal.set($event)"
[config]="modalConfig"
/>
